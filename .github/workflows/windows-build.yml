name: Windows build

# Build ban Windows Release va dong goi thanh 1 file setup.exe duy nhat
# (Inno Setup) de gui khach — xem trao doi "buid bản win... 1 file exe
# duy nhất gửi khách". Dev machine tuy la Windows nhung `flutter build
# windows` can nuget + ATL + Developer Mode cai san (xem memory
# "Windows build toolchain") — CI tu cai/bat cac thu nay moi lan, tranh
# phu thuoc cau hinh may local.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Developer Mode
        shell: powershell
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - run: flutter pub get

      # 2 workaround cho toolchain moi tren windows-latest, khong lien
      # quan gi den code app:
      # - CMAKE_POLICY_VERSION_MINIMUM: pdfx tai pdfium bang 1 sub-project
      #   CMake rieng (DownloadProject.cmake) khai cmake_minimum_required
      #   qua cu, CMake 4.x tren runner tu choi thang — day la co che
      #   chinh thuc CMake >= 3.31 dua ra cho dung truong hop nay.
      # - CL=/D_SILENCE_...: permission_handler_windows dung C++/WinRT
      #   (winrt::fire_and_forget) keo theo header <experimental/coroutine>
      #   cu; MSVC moi tren runner nang canh bao nay thanh loi cung. `CL`
      #   la bien moi truong MSVC tu doc them cho MOI lan goi cl.exe,
      #   dung de them macro ma khong phai sua CMakeLists cua plugin.
      - run: flutter build windows --release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Read app version from pubspec.yaml
        id: app_version
        shell: bash
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.app_version.outputs.version }} windows\installer\csb_vocab_app.iss

      - uses: actions/upload-artifact@v4
        with:
          name: csb-vocab-app-windows-setup
          path: build\installer\*.exe
          retention-days: 14
